<title>Dolphin CREATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#12324A;--sky:#43A7D5;--bg:#EAF6F8;--surface:#FFFFFF;--surface2:#F3F9FB;--ink:#12324A;--ink2:#4F6879;--ink3:#7B92A1;
  --line:#D2E3EA;--side:#12324A;--sideink:#C9E2EE;--sideact:#1D4A69;--accentbg:#DCEFF8;--accentink:#1F6F99;
  --good:#23805F;--goodbg:#E0F2EA;--warn:#A76F0C;--warnbg:#FBF0D9;--bad:#B63D35;--badbg:#F9E2DF;
  --shadow:0 1px 2px rgba(18,50,74,.06),0 4px 14px rgba(18,50,74,.05);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"Roboto Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-mark:"Cormorant Garamond","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A1924;--surface:#102433;--surface2:#0D1F2C;--ink:#E2EEF4;--ink2:#A2BBCA;--ink3:#7690A1;
  --line:#1F3A4E;--side:#07121B;--sideink:#AFCFDF;--sideact:#153246;--sky:#5CB8E2;--accentbg:#12344A;--accentink:#8FD0EE;
  --good:#5CC49C;--goodbg:#123528;--warn:#E3B04B;--warnbg:#3A2C0E;--bad:#EF7F76;--badbg:#3D1a17;--shadow:none;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A1924;--surface:#102433;--surface2:#0D1F2C;--ink:#E2EEF4;--ink2:#A2BBCA;--ink3:#7690A1;
  --line:#1F3A4E;--side:#07121B;--sideink:#AFCFDF;--sideact:#153246;--sky:#5CB8E2;--accentbg:#12344A;--accentink:#8FD0EE;
  --good:#5CC49C;--goodbg:#123528;--warn:#E3B04B;--warnbg:#3A2C0E;--bad:#EF7F76;--badbg:#3D1a17;--shadow:none;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--sideink);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
.brand b{font-family:var(--f-mark);font-style:italic;font-size:34px;font-weight:600;color:#fff;line-height:1;letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.12em;color:var(--sideink);opacity:.8}
.tag{font-size:11.5px;color:var(--sideink);opacity:.85;padding:0 8px;line-height:1.6}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--sideink);font-size:13.5px}
.nav button .n{font-family:var(--f-num);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(201,226,238,.35);flex:none}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--sideact);color:#fff}
.nav button[aria-current="page"] .n{background:var(--sky);border-color:var(--sky);color:#08202f}
.nav button:focus-visible{outline:2px solid var(--sky)}
.nav .sep{height:1px;background:rgba(201,226,238,.15);margin:8px 4px}
.side .foot{margin-top:auto;font-size:11px;opacity:.7;padding:0 8px}
/* main */
.main{padding-inline:28px;padding-block:18px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top label{display:flex;flex-direction:column;font-size:10.5px;letter-spacing:.08em;color:var(--ink3);gap:2px}
.top select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;min-width:0;max-width:100%}
.top .meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.demo{background:var(--warnbg);color:var(--warn);font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:500}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.h1row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.lead{color:var(--ink2);margin:0 0 20px;max-width:70ch}
h2{font-size:15.5px;margin:0 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:13.5px;margin:0 0 8px;font-weight:700}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}.small{font-size:12px}.tiny{font-size:11px;color:var(--ink3)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;line-height:1.4}
.btn:hover{border-color:var(--sky)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:#06202f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:#06202f}}
.btn.ai{border-color:var(--sky);color:var(--accentink);background:var(--accentbg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:99px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.pill.sky{background:var(--accentbg);color:var(--accentink);border-color:transparent}
/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:500;color:var(--ink3);font-size:11px;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.r{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--surface2);font-weight:700}
tr.tot td{font-weight:700;border-top:2px solid var(--ink3)}
.na{color:var(--ink3);font-family:var(--f-body)!important;font-size:11.5px}
.dlt{font-size:10.5px;display:block;color:var(--ink3)}
.dlt.up{color:var(--good)}.dlt.dn{color:var(--bad)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:12px 14px;box-shadow:inset -1px -1px 0 var(--line)}
.kpi .l{font-size:11px;color:var(--ink3);letter-spacing:.04em}
.kpi .v{font-family:var(--f-num);font-size:20px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--ink2)}
.kpi.main .v{color:var(--accentink)}
/* definitions */
details.def{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
details.def summary{cursor:pointer;color:var(--ink3)}
details.def ul{margin:6px 0 0;padding-left:18px}
/* conn cards */
.conn{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.conn .t{font-weight:700;font-size:13px}
.drop{border:1.5px dashed var(--sky);border-radius:10px;padding:18px;text-align:center;background:var(--accentbg);color:var(--accentink)}
.drop input{display:none}
/* bars */
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;position:relative;min-width:60px}
.bar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.bar.neg i{background:var(--ink3)}
.bm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
/* funnel */
.fn{display:grid;grid-template-columns:minmax(120px,1.3fr) 80px minmax(120px,2fr) 70px 22px;gap:6px 12px;align-items:center;font-size:12.5px}
.fn .h{font-size:10.5px;color:var(--ink3);letter-spacing:.05em}
.fn .src{font-size:10px;color:var(--ink3);display:block}
.fn .flag{color:var(--bad);font-weight:700}
.fbar{height:14px;background:var(--surface2);border-radius:4px;position:relative;overflow:visible}
.fbar i{position:absolute;left:0;top:0;bottom:0;background:var(--sky);border-radius:4px}
.fbar.low i{background:var(--bad)}
.fbar .bm{top:-3px;bottom:-3px}
/* creative */
.crlist{display:flex;flex-direction:column;gap:8px}
.cri{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cri:hover{border-color:var(--sky)}
.cri[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 2px var(--accentbg)}
.cri:focus-visible{outline:2px solid var(--sky)}
.cri .nm{font-weight:700;font-size:13px}
.cri .sub{grid-column:2/4;font-size:11.5px;color:var(--ink2)}
.mico{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accentbg);color:var(--accentink);font-family:var(--f-num)}
.crwrap{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:18px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld>span{font-size:11.5px;color:var(--ink3)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:6px 8px;width:100%;font-size:13px}
.fld textarea{min-height:92px;resize:vertical;line-height:1.7}
.cnt{font-family:var(--f-num);font-size:11px;color:var(--ink3)}
.cnt .over{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accentbg);border-color:var(--sky);color:var(--accentink)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:7px}
.checks li.ng{background:var(--badbg)}
.checks li.wn{background:var(--warnbg)}
.checks li .ic{font-weight:700;text-align:center}
.checks li.ok .ic{color:var(--good)}.checks li.ng .ic{color:var(--bad)}.checks li.wn .ic{color:var(--warn)}
/* previews */
.serp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);font-family:Arial,var(--f-body)}
.serp .sp{font-size:11px;color:var(--ink2)}.serp .sp b{color:var(--ink)}
.serp .hl{color:#1a0dab;font-size:17px;line-height:1.35;margin:3px 0}
:root[data-theme="dark"] .serp .hl{color:#8ab4f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .serp .hl{color:#8ab4f8}}
.serp .ds{font-size:13px;color:var(--ink2)}
.ig{border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:320px;overflow:hidden}
.ig .hd{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;font-weight:700}
.ig .av{width:24px;height:24px;border-radius:50%;background:var(--sky)}
.ig .tx{padding:8px 10px;font-size:12px;white-space:pre-wrap}
.ig .cta{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--accentink)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.car .ph{flex:0 0 88%;scroll-snap-align:start;border-right:2px solid var(--surface)}
/* asset thumbs */
.ph{aspect-ratio:1/1;max-width:100%;position:relative;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.45);background-size:cover;background-position:center}
.ph::before{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(8,20,30,.55))}
.ph>.cap{position:relative}
.ph .gen{position:absolute;top:6px;left:6px;background:rgba(10,25,36,.72);padding:1px 7px;border-radius:99px;font-size:10px;text-shadow:none}
.sc-sea{background:linear-gradient(180deg,#bfe3f2 0%,#eaf6f8 42%,#4c9fc4 43%,#1e5977 100%)}
.sc-food{background:radial-gradient(circle at 50% 55%,#f6efe4 0 22%,#e6d7c2 23% 30%,#f9f7f2 31% 60%,#b9c6c9 61%)}
.sc-chapel{background:linear-gradient(90deg,#d9e7ee 0 12%,#f6fafb 12% 20%,#d9e7ee 20% 80%,#f6fafb 80% 88%,#d9e7ee 88%),linear-gradient(#fff,#cfe3ec)}
.sc-dusk{background:linear-gradient(180deg,#6d7fa6 0%,#c9a9b8 45%,#e9d3c3 62%,#546b86 63%,#2b3b54 100%)}
.sc-small{background:radial-gradient(circle at 30% 60%,#f3e6d4 0 12%,transparent 13%),radial-gradient(circle at 62% 58%,#f3e6d4 0 12%,transparent 13%),linear-gradient(#e9e2d6,#bfae98)}
.sc-garden{background:radial-gradient(ellipse at 50% 100%,#6b9c6b 0 45%,transparent 46%),linear-gradient(#dff0e4,#a9cfae)}
.sc-wa{background:linear-gradient(135deg,#2f4a3d 0 30%,#d9c9a6 30% 34%,#8b3a3a 34% 60%,#f0e6d2 60%)}
.sc-cuisine{background:radial-gradient(circle at 40% 50%,#2e2a26 0 20%,transparent 21%),radial-gradient(circle at 65% 45%,#b44b3a 0 9%,transparent 10%),linear-gradient(#e7dfd2,#c9b99f)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.asset{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.asset .ph{border-bottom:1px solid var(--line)}
.asset .b{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;flex:1}
/* ai */
.aiout{border:1px solid var(--sky);background:var(--accentbg);border-radius:10px;padding:14px;font-size:13px}
.aiout h4{margin:10px 0 4px;font-size:12.5px;color:var(--accentink)}
.aiout h4:first-child{margin-top:0}
.aiout ul{margin:0;padding-left:18px}
.aiout li{margin:3px 0}
.aiout .kv{color:var(--ink3);font-size:11.5px}
.quote{border-left:3px solid var(--sky);padding:2px 0 2px 10px;color:var(--ink2);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--sky);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--sky)}
pre.prompt{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:1.7;margin:0;font-family:var(--f-body);max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(8,20,30,.5);display:grid;place-items:center;z-index:40;padding:16px}
.modal .panel{width:min(720px,100%);max-height:85vh;overflow:auto}
.modal textarea{width:100%;min-height:260px;font-family:var(--f-num);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface2)}
.chart text{fill:var(--ink3);font-size:10px;font-family:var(--f-num)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lock{padding:40px;text-align:center}
.auth{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:48px;background:var(--bg)}
.authcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.who{display:flex;flex-direction:column;line-height:1.35;padding-left:12px;border-left:1px solid var(--line)}
.mini .cap,.mini .gen{display:none}
.mini .ph::before{display:none}
.sechd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}.sechd h2{margin:0}
.dno{font-family:var(--f-num);font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--navy);color:#fff;white-space:nowrap}
:root[data-theme="dark"] .dno{background:var(--sky);color:#06202f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dno{background:var(--sky);color:#06202f}}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.bno{font-family:var(--f-num);font-size:12px;color:var(--accentink);font-weight:500}
.bl{font-size:11px;color:var(--ink3);letter-spacing:.03em}
.whys{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.wy{display:flex;flex-direction:column;gap:2px}
.story{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fs{border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;min-width:120px;background:var(--surface2)}
.fs .num{font-size:20px;font-weight:500}.arr{color:var(--ink3)}
.studio{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,1fr);gap:18px;align-items:start}
.stview{position:sticky;top:12px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pick{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;gap:3px;padding-bottom:6px;background:var(--surface)}
.pick .ph{font-size:10px}.pick .pk{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 0;font-size:11.5px;gap:4px}.pick .tiny{padding:0 8px}
.pick[aria-pressed="true"],.cp[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 2px var(--accentbg)}
.pick:focus-visible,.cp:focus-visible,.combo:focus-visible{outline:2px solid var(--sky)}
.copies{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.cp{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.cp:hover,.pick:hover,.combo:hover{border-color:var(--sky)}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

async function resetPw(i){const a=ACCOUNTS[i];const pw=genPw();a.salt=newSalt();a.hash=await pwHash(pw,a.salt);a.mustChange=true;a.locked=false;a.fails=0;S.issued={name:a.name,pw};logEvt(a.code,a.id,true,'パスワード再発行');render()}


/* ================= metrics ================= */
function sumRows(rows,p){const o={imp:0,clicks:0,cost:0,lp:0,cta:0,fs:0,ferr:0,lead:0,res:0,valid:0,visit:0,contract:0,gp:0,rev:0,mcv:0};rows.forEach(r=>{const c=r.p[p];for(const k in o)o[k]+=c[k]});return o}
function adRows(){return F().rows.filter(r=>S.media==='all'||r.ad.media===S.media)}
function otherSum(p){return F().other[p].reduce((a,o)=>({res:a.res+o.res,valid:a.valid+o.valid,visit:a.visit+o.visit,contract:a.contract+o.contract}),{res:0,valid:0,visit:0,contract:0})}
function linkRate(p){const all=sumRows(F().rows,p);const o=otherSum(p);const unjoined=all.lead-all.res;return {rate:div(all.res,all.res+unjoined+o.res),linked:all.res,unjoined,other:o.res,total:all.res+unjoined+o.res}}
function delta(cur,prev,invert){if(cur==null||prev==null||!isFinite(cur)||!isFinite(prev)||prev===0)return '';const d=(cur-prev)/prev;const good=invert?d<0:d>0;return `<span class="dlt ${Math.abs(d)<.005?'':good?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d*100).toFixed(1)}%</span>`}

/* ================= analysis ================= */
function analyze(p,src){
  const d=F();const all=d.cons.filter(c=>c.p===p&&(src==='all'||c.src===src));
  const list=all.filter(c=>c.consent);const excl=all.length-list.length;
  const n=list.length,con=list.filter(c=>c.contract),non=list.filter(c=>!c.contract),cr=div(con.length,n);
  const fac=d.factors.map(f=>{const g=list.filter(c=>c.pri.includes(f.k));const gk=g.filter(c=>c.contract).length;
    return {f,n:g.length,k:gk,cr:div(gk,g.length),diff:g.length&&n?(gk/g.length-cr)*100:null,
      conShare:div(con.filter(c=>c.pri.includes(f.k)).length,con.length),nonShare:div(non.filter(c=>c.pri.includes(f.k)).length,non.length),
      explicit:div(g.filter(c=>c.explicit).length,g.length),ex:g.find(c=>c.explicit)}}).sort((a,b)=>(b.diff??-999)-(a.diff??-999));
  const cnt=(arr,key)=>{const m={};arr.forEach(c=>{if(c[key])m[c[key]]=(m[c[key]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const seg=key=>{const m={};list.forEach(c=>{m[c[key]]=m[c[key]]||{n:0,k:0};m[c[key]].n++;if(c.contract)m[c[key]].k++});return Object.entries(m).map(([v,o])=>({v,n:o.n,cr:div(o.k,o.n)}))};
  const staff=seg('staff');
  const clusters=d.clusters.map(cl=>{const g=list.filter(c=>c.cl===cl.k);const gk=g.filter(c=>c.contract).length;const pc={};g.forEach(c=>c.pri.forEach(k=>pc[k]=(pc[k]||0)+1));const tk=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>d.factors.find(f=>f.k===e[0]).label);return {cl,n:g.length,cr:div(gk,g.length),diff:g.length&&n?(gk/g.length-cr)*100:null,top:tk.join('・')||'—'}}).sort((a,b)=>(b.n>=S.minN)-(a.n>=S.minN)||(b.cr??-1)-(a.cr??-1));
  const cm={};list.forEach(c=>{const k=c.cl+'|'+c.age;cm[k]=cm[k]||{n:0,k:0};cm[k].n++;if(c.contract)cm[k].k++});
  const combos=Object.entries(cm).map(([k,o])=>{const [cl,age]=k.split('|');return {cl:(d.clusters.find(x=>x.k===cl)||{label:cl}).label,age,n:o.n,cr:div(o.k,o.n)}}).filter(x=>x.n>=S.minN).sort((a,b)=>b.cr-a.cr);
  const visuals=d.visuals.map(v=>{const sc=con.filter(c=>(c.vs||[]).includes(v.id)).length,sn=non.filter(c=>(c.vs||[]).includes(v.id)).length;return {v,n:sc+sn,con:div(sc,con.length),non:div(sn,non.length),lift:con.length&&non.length?(sc/con.length-sn/non.length)*100:null}}).sort((a,b)=>(b.lift??-99)-(a.lift??-99));
  const priShare=d.factors.map(f=>[f.label,list.filter(c=>c.pri.includes(f.k)).length]).sort((a,b)=>b[1]-a[1]);
  const decideRows=cnt(con,'decide').map(([k,v])=>({k,v,dd:d.decideDetail[k],texts:[...new Set(con.filter(c=>c.decide===k&&c.detail).map(c=>c.detail))].slice(0,3)}));
  const compM=cnt(list,'comp').map(([k,v])=>({k,v,lost:non.filter(c=>c.comp===k).length}));
  return {n,k:con.length,cr,excl,all:all.length,fac,reasons:cnt(non,'reason'),motives:cnt(list,'motive'),decides:cnt(con,'decide'),age:seg('age').sort((a,b)=>AGES.indexOf(a.v)-AGES.indexOf(b.v)),area:seg('area'),staff:staff.sort((a,b)=>a.v<b.v?-1:1),srcMix:cnt(list,'src'),non:non.length,clusters,combos,visuals,priShare,decideRows,compM};
}
function confLabel(n,diff){if(n<S.minN)return '<span class="pill bad">参考外（小標本）</span>';if(n<30)return '<span class="pill warn">確度 低</span>';if(diff!=null&&Math.abs(diff)<3)return '<span class="pill">差は小さい</span>';return '<span class="pill sky">確度 中</span>'}

/* ================= creative checks (P5) ================= */
function crText(c){return c.media==='Google検索'?[...c.headlines,...c.descs].join(' '):c.media==='Instagram'?[c.catch,c.sub,c.primary,c.headline].join(' '):[c.hook,...(c.scenes||[]).map(s=>s.telop),c.cta].join(' ')}
function crChecks(cr){
  const d=F(),out=[];const add=(ok,sev,name,detail,fix)=>out.push({ok,sev,name,detail,fix});
  const claims=cr.claims.map(id=>d.claims.find(c=>c.id===id)).filter(Boolean);
  const assets=cr.assets.map(id=>d.assets.find(a=>a.id===id)).filter(Boolean);
  const lp=d.lps.find(l=>l.id===cr.lp);
  const text=crText(cr);
  const un=claims.filter(c=>c.status!=='承認済');
  add(claims.length>0&&!un.length,'blocker','事実の裏付け',!claims.length?'施設事実が紐付いていません':un.length?`未承認の施設事実: ${un.map(c=>c.id+'「'+c.text+'」').join('、')}`:`承認済みの施設事実 ${claims.map(c=>c.id).join('・')} に基づく`,'会場担当の承認を得るか、承認済みの事実に差し替える');
  const offers=claims.filter(c=>c.cond);const miss=offers.filter(c=>!(text.includes(c.condKey)));
  add(!miss.length,'blocker','特典・料金の条件表記',offers.length?(miss.length?`条件「${miss.map(c=>c.cond).join('／')}」が広告文にありません`:'条件の表記あり'):'条件付きの訴求なし','広告文・テロップに「※」で条件を明記する');
  if(cr.media==='Google検索'){
    const hOver=cr.headlines.filter(h=>gw(h)>30),dOver=cr.descs.filter(h=>gw(h)>90),pOver=[cr.path1,cr.path2].filter(x=>gw(x)>15);
    const okCnt=cr.headlines.length>=3&&cr.headlines.length<=15&&cr.descs.length>=2&&cr.descs.length<=4;
    add(okCnt&&!hOver.length&&!dOver.length&&!pOver.length,'blocker','媒体仕様（Google検索）',`見出し${cr.headlines.length}件・説明文${cr.descs.length}件${hOver.length?`／見出し超過 ${hOver.length}件`:''}${dOver.length?`／説明文超過 ${dOver.length}件`:''}${pOver.length?'／パス超過':''}`,'見出し3〜15件（半角30）、説明文2〜4件（半角90）、パス半角15以内。接続時にAPI仕様で再検証');
    add((cr.targets||[]).length>0,'warn','ターゲット検索案',`${(cr.targets||[]).length}ターゲット・${(cr.targets||[]).reduce((s,t)=>s+(t.kws||[]).length,0)}キーワード`,'ターゲットごとにキーワードと除外語を用意する');
  }else if(cr.media==='Instagram'){
    const need=cr.format==='カルーセル'?2:1;const okA=assets.length>=need&&(cr.format!=='静止画'||assets.length===1);
    add(okA,'blocker','媒体仕様（Instagram）',`${cr.format}・画像${assets.length}点`,cr.format==='カルーセル'?'カルーセルは画像2〜10点':'静止画は画像1点');
    add([...(cr.primary||'')].length<=125&&gw(cr.headline)<=40&&[...(cr.catch||'')].length<=15,'warn','テキスト量（推奨）',`画像内キャッチ${[...(cr.catch||'')].length}字・主文${[...(cr.primary||'')].length}字・見出し${[...(cr.headline||'')].length}字`,'画像内キャッチ15字、主文125字、見出し全角20字程度に収めると読まれやすい');
    add((cr.hashtags||[]).length<=3,'warn','ハッシュタグの数',`${(cr.hashtags||[]).length}個`,'広告ではタグから他の投稿へ移動できるため3個以内');
  }else{
    const dur=+((cr.format.match(/(\d+)秒/)||[])[1]||0);const ends=(cr.scenes||[]).map(s=>+((s.t.match(/(\d+)\D*秒?$/)||[])[1]||0));const last=Math.max(0,...ends);
    add((cr.scenes||[]).length>=3&&last<=dur&&last>0,'blocker','媒体仕様（YouTube）',`${cr.format}・${(cr.scenes||[]).length}シーン・最後のシーン ${last}秒`,'3シーン以上、尺の中に収める');
    add([...(cr.hook||'')].length<=15,'warn','冒頭のフック',`${[...(cr.hook||'')].length}字`,'最初の数秒で読める全角15字以内');
    add(cr.music&&cr.music!=='未定','blocker','音源の権利',`音源：${cr.music||'未定'}`,'ライセンス済みか会場オリジナルの音源を選ぶ');
  }
  const gen=assets.filter(a=>a.kind==='生成');
  if(cr.media==='Google検索')add(!gen.length,'blocker','実写／生成の区分',gen.length?`検索広告の画像アセットに生成画像 ${gen.map(a=>a.id).join('・')}`:'実写のみ','検索広告の画像には表記を入れられないため、生成画像を使わない');
  else add(!gen.length||cr.imgLabel,'blocker','実写／生成の区分',gen.length?(cr.imgLabel?`生成画像 ${gen.map(a=>a.id).join('・')} に「イメージ」表記あり`:`生成画像 ${gen.map(a=>a.id).join('・')} に「イメージ」表記がありません`):'実写のみ','画像内・主文・テロップに「写真はイメージです」を表記');
  const today='2026-09-23';const bad=assets.filter(a=>a.rights!=='確認済'||a.status!=='承認済'||(a.expiry!=='—'&&a.expiry<today));
  add(!bad.length,'blocker','素材の権利・承認',bad.length?bad.map(a=>`${a.id}（権利${a.rights}・${a.status}）`).join('、'):assets.length?'全素材 権利確認済・承認済':'画像なし','画像庫で権利確認と会場承認を行う');
  if(lp){
    const nm=claims.filter(c=>!c.keys.some(k=>lp.keys.includes(k)));
    const cf=claims.filter(c=>c.value&&lp.values&&lp.values[c.valueKey]&&lp.values[c.valueKey]!==c.value);
    add(!nm.length&&!cf.length,'blocker','広告とLPの一致',cf.length?cf.map(c=>`広告「${c.value}」とLP「${lp.values[c.valueKey]}」が不一致`).join('、'):nm.length?`LP ${lp.id} に ${nm.map(c=>c.id).join('・')} の内容がありません`:`LP ${lp.id}「${lp.title}」と訴求が一致`,'LPの記載を施設事実に揃えるか、対応するLPに変更');
  }else add(false,'blocker','広告とLPの一致','LPが未設定','LPを選択');
  const url=crUrl(cr);const u=new URL(url);const need=['utm_source','utm_medium','utm_campaign','utm_content'];const lack=need.filter(k=>!u.searchParams.get(k));
  add(!lack.length,'blocker','計測URL',lack.length?`不足: ${lack.join(', ')}`:'UTM 4項目・lead_id受け渡しフォーム設定済','UTMを付与');
  const committed=d.creatives.filter(c=>c.id!==cr.id&&c.sent).reduce((a,c)=>a+c.budget,0);
  add(cr.budget>0&&committed+cr.budget<=d.cap,'blocker','期間と予算',`月額 ${yenT(cr.budget)}円／入稿済み ${yenT(committed)}円／上限 ${yenT(d.cap)}円`,'月間上限内に収める（上限は会場担当が設定）');
  return out;
}
function crUrl(cr){const d=F();const lp=d.lps.find(l=>l.id===cr.lp)||d.lps[0];const src={'Google検索':'google','Instagram':'instagram','YouTube':'youtube'}[cr.media];const med={'Google検索':'cpc','Instagram':'paid_social','YouTube':'video'}[cr.media];return `${d.domain}${lp.path}?utm_source=${src}&utm_medium=${med}&utm_campaign=${encodeURIComponent(S.fac+'_'+cr.name.split('｜')[0])}&utm_content=${cr.id}_v${cr.v}`}
function crState(cr){const ch=crChecks(cr);const blockers=ch.filter(c=>!c.ok&&c.sev==='blocker');const apOk=cr.ap.A&&cr.ap.B&&cr.ap.V;
  const status=cr.sent?'入稿済':blockers.length?'要修正':apOk?'公開可':'承認待ち';return {ch,blockers,apOk,ready:!blockers.length&&apOk,status}}
const stPill=s=>`<span class="pill ${({入稿済:'sky',要修正:'bad',公開可:'good',承認待ち:'warn'})[s]}">${s}</span>`;

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);if(row.some(x=>x!==''))rows.push(row)}return rows}
function autoMap(h){const syn={consultation_id:['consultation_id','接客id','session_id'],lead_id:['lead_id','リードid'],facility_id:['facility_id','施設id'],consent_ad:['consent_ad','広告改善同意','consent_ad_improvement'],consult_date:['consult_date','接客日時','date'],source:['source','流入元','utm_source'],priorities:['priorities','重視点'],visit_motive:['visit_motive','来館理由'],decision_factor:['decision_factor','決め手'],noncontract_reason:['noncontract_reason','非成約理由'],contract:['contract','成約'],quote:['quote','根拠発言','発言']};
  const m={};for(const [k,list] of Object.entries(syn)){const i=h.findIndex(x=>list.includes(x.trim().toLowerCase()));m[k]=i}return m}
function loadCsv(text,file){const rows=parseCSV(text);if(rows.length<2){toast('CSVにデータ行がありません。1行目に見出し、2行目以降にデータを入れてください');return}
  S.imp={file,head:rows[0],rows:rows.slice(1),map:autoMap(rows[0])};render()}
function validateImport(imp){
  const m=imp.map,g=(r,k)=>m[k]>=0?(r[m[k]]||'').trim():'';const seen=new Set(),d=F();
  let ok=[],dup=0,miss=0,excl=0,wrongFac=0;
  imp.rows.forEach(r=>{const id=g(r,'consultation_id'),lead=g(r,'lead_id'),fac=g(r,'facility_id');
    if(!id||!lead||!fac){miss++;return}
    if(fac!==d.id){wrongFac++;return}
    if(seen.has(id)||d.cons.some(c=>c.id===id)){dup++;return}seen.add(id);
    if(!/^(1|true|yes|有|同意)$/i.test(g(r,'consent_ad'))){excl++;return}
    ok.push(r)});
  const pii=imp.head.map((h,i)=>PII_HDR.test(h)?h:null).filter(Boolean);
  const masked=imp.rows.filter(r=>m.quote>=0&&maskPII(r[m.quote])!==r[m.quote]).length;
  return {ok,dup,miss,excl,wrongFac,pii,masked};
}

function weekChart(rows,p){

function dayList(p){const d0=new Date(PSTART[p]+'T00:00:00+09:00');return Array.from({length:28},(_,i)=>{const d=new Date(d0.getTime()+i*864e5);const j=new Date(d.getTime()+9*36e5);return {i,label:`${j.getUTCMonth()+1}/${j.getUTCDate()}`,iso:j.toISOString().slice(0,10),dow:j.getUTCDay()}})}
function adDaily(row,p){const k=S.fac+'|'+p+'|day|'+row.ad.id;if(BD[k])return BD[k];const r=rng(hash(k).split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,11));const c=row.p[p];const days=dayList(p);
  const wk=c.wk.map(w=>w.cost||1),wa=wk.reduce((a,b)=>a+b)/4;
  const parts=days.map(d=>({k:d.i,w:DOW_W[d.dow]*(wk[Math.floor(d.i/7)]/wa),ctr:1,cv:DOW_CV[d.dow],meta:{}}));
  const out=splitM(mTot(c),parts,r);const valid=[];c.wk.forEach((w,wi)=>{const ws=[0,1,2,3,4,5,6].map(j=>out[wi*7+j].clicks*DOW_CV[days[wi*7+j].dow]+.01);alloc(w.valid,ws).forEach(v=>valid.push(v))});
  out.forEach((o,i)=>o.valid=valid[i]||0);return BD[k]=out}
function dailyAgg(media,p){const rows=F().rows.filter(x=>media==='合計'||x.ad.media===media);const days=dayList(p);
  return days.map(d=>{const o={...d,imp:0,clicks:0,cost:0,cv:0,valid:0};rows.forEach(x=>{const a=adDaily(x,p)[d.i];o.imp+=a.imp;o.clicks+=a.clicks;o.cost+=a.cost;o.cv+=a.cv;o.valid+=a.valid});return o})}
function dailyChart(days){const W=760,H=230,L=52,R=40,T=18,B=34;const iw=W-L-R,ih=H-T-B;const fk=feeK();
  const cMax=Math.max(1,...days.map(x=>x.cost*fk));const step=cMax>200000?50000:cMax>50000?10000:cMax>10000?5000:1000;const cTop=Math.ceil(cMax/step)*step;const vMax=Math.max(4,Math.ceil(Math.max(...days.map(x=>x.cv))/2)*2);
  const bw=iw/days.length*.62,x=i=>L+iw/days.length*(i+.5);let g='';
  for(let t=0;t<=4;t++){const y=T+ih-ih*t/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3}" text-anchor="end">${(cTop*t/4/10000).toFixed(cTop>=40000?0:1)}万</text><text x="${W-R+6}" y="${y+3}">${Math.round(vMax*t/4)}</text>`}
  const bars=days.map((d,i)=>{const h=ih*d.cost*fk/cTop;const we=d.dow===0||d.dow===6;return `<rect x="${x(i)-bw/2}" y="${T+ih-h}" width="${bw}" height="${h}" rx="2" fill="var(--sky)" opacity="${we?.85:.45}"><title>${d.label}（${DOW[d.dow]}） 使用額 ${yenT(d.cost*fk)}円・獲得 ${d.cv}件</title></rect>${i%7===0?`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${d.label}</text>`:''}`}).join('');
  const pts=days.map((d,i)=>[x(i),T+ih-ih*d.cv/vMax]);
  return `<div class="legend"><span><i style="background:var(--sky);opacity:.45"></i>使用額（平日）</span><span><i style="background:var(--sky);opacity:.85"></i>使用額（土日）</span><span><i style="background:var(--ink)"></i>獲得数（右軸）</span></div>
  <div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto" role="img" aria-label="日毎の使用額と獲得数">${g}${bars}<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.4" fill="var(--ink)"/>`).join('')}</svg></div>`}

function diag(c,t){
  if(c.visit<8)return '<span class="pill">保留・小標本</span>';
  const ctrHi=div(c.clicks,c.imp)>div(t.clicks,t.imp)*1.3,resLo=div(c.lead,c.lp)<div(t.lead,t.lp)*.8;
  const visLo=div(c.visit,c.valid)<div(t.visit,t.valid)*.8,conLo=div(c.contract,c.visit)<div(t.contract,t.visit)*.7,valLo=div(c.valid,c.res)<div(t.valid,t.res)*.85;
  if(visLo||valLo)return '<span class="pill warn">予約高・来館低</span><span class="tiny" style="display:block">低意向予約・追客を確認</span>';
  if(ctrHi&&resLo)return '<span class="pill warn">CTR高・予約低</span><span class="tiny" style="display:block">広告・LP・フォームの整合</span>';
  if(conLo)return '<span class="pill warn">来館高・成約低</span><span class="tiny" style="display:block">価格説明・競合比較</span>';
  if(c.gp&&c.gp/c.cost<(t.gp/t.cost)*.6)return '<span class="pill warn">粗利低</span><span class="tiny" style="display:block">値引き・原価を確認</span>';
  return '<span class="pill good">目立つ詰まりなし</span>';
}

     audit(`${cr.id} を v${cr.v} に更新（承認リセット）`,cr.id);S.draft=null;render();toast(`v${cr.v} を保存しました。承認はやり直しです`);break}
   case 'ap':cr.ap[S.role]=true;audit(`${cr.id} v${cr.v} を承認`,cr.id);render();toast('承認しました');break;
   case 'unap':cr.ap[S.role]=false;audit(`${cr.id} v${cr.v} の承認を取り消し`,cr.id);render();break;
   case 'send':{if(cr.sent){toast(`冪等キー ${cr.sent.key} で送信済みのため、重複作成しません`);break}
     const st=crState(cr);if(!st.ready){toast('ブロッカーの解消と3者の承認が必要です');break}
     cr.sent={key:hash(S.fac+cr.id+'v'+cr.v),at:nowStr()};cr.hist=cr.hist.concat([{v:cr.v,at:cr.sent.at,by:roleName(),note:`入稿（冪等キー ${cr.sent.key}・月額上限 ${yenT(cr.budget)}円）`}]);audit(`${cr.id} v${cr.v} を入稿（冪等キー ${cr.sent.key}）`,cr.id);render();toast('入稿しました。入稿用CSVに含まれます');break}
   case 'rights':{const a=d.assets.find(x=>x.id===v);a.rights='確認済';audit(`${v} の権利を確認済みにした`,v);render();break}
   case 'assetap':{const a=d.assets.find(x=>x.id===v);a.status='承認済';audit(`${v} の公開を承認`,v);render();break}
   case 'claimap':{const c=d.claims.find(x=>x.id===v);c.status='承認済';audit(`施設事実 ${v} を承認`,v);render();toast(`${v} を承認しました。LPとの不一致は別途チェックされます`);break}
   case 'ai':runAI(b.dataset.k);break;
   case 'stAsset':studio().asset=v;render();break;
   case 'stCopy':{const st=studio(),c=copyCands().find(x=>x.id===v);if(c){st.copy=c.id;st.catch=c.text;st.sub=c.sub||''}render();break}
   case 'stSet':studio()[b.dataset.k]=v;render();break;
   case 'stCombo':{const st=studio(),c=copyCands().find(x=>x.id===b.dataset.c);st.asset=b.dataset.a;if(c){st.copy=c.id;st.catch=c.text;st.sub=c.sub||''}render();window.scrollTo({top:$('.studio').offsetTop-20});break}
   case 'stPng':studioPng();break;
   case 'stToIg':studioToIg();break;
   case 'stAiCopy':runCopyAI();break;
   case 'dolTpl':save('dolphin_images_template.csv',csvStr([['file_name','asset_id','title','prompt','target','rights','expiry'],['chapel_dusk_01.jpg','DOL-401','チャペル夕景イメージ','チャペル正面の夕景、構造は変えない','フォトジェニック重視','確認中','2026-12-31']]));break;
   case 'ratio':S.ratio=v;render();break;
   case 'savePng':savePng();break;
   case 'gotoComp':S.view='creative';S.crTab='competitor';render();window.scrollTo(0,0);break;
   case 'exportFeedback':exportFeedback();break;
   case 'copyTags':{const t=d.hashtags.map(h=>h[0]).join(' ');navigator.clipboard?.writeText(t).then(()=>toast('ハッシュタグをコピーしました')).catch(()=>toast(t));break}
   case 'addComp':{const nm=$('#cmpName').value.trim(),hp=$('#cmpHp').value.trim(),ig=$('#cmpIg').value.trim();
     if(!nm){toast('会場名を入力してください');break}
     if(!/^https:\/\/(www\.)?instagram\.com\/[A-Za-z0-9._]{1,30}\/?$/.test(ig)){toast('InstagramのURLは https://www.instagram.com/アカウント名/ の形で入力してください');break}
     if(hp&&!/^https?:\/\/\S+$/.test(hp)){toast('HPのURLは https:// から入力してください');break}
     d.competitors.push({name:nm,hp,ig,state:'取得待ち（API接続後）',posts:null,themes:null,formats:null,note:''});audit(`競合「${nm}」のInstagramを登録`,'競合');render();toast('登録しました。訴求傾向はInstagram API接続後に取得します');break}
   case 'delComp':{const c=d.competitors[+v];d.competitors.splice(+v,1);audit(`競合「${c.name}」を削除`,'競合');render();break}
   case 'aistop':ctls[b.dataset.k]?.abort();break;
   case 'sampleCsv':loadCsv(sampleCsvText(),`sample_dolphin_${S.fac}.csv`);break;
   case 'tplCsv':save('dolphin_create_import_template.csv',csvStr([IMPORT_FIELDS.map(f=>f[0])]));break;
   case 'commitImport':commitImport();break;
   case 'cancelImport':S.imp=null;render();break;
   case 'exportAdReport':exportAdReport();break;
   case 'artab':S.arTab=v;render();break;
   case 'logout':logout();break;
   case 'changePw':S.changingPw=true;S.pwErr='';render();break;
   case 'pwCancel':S.changingPw=false;S.pwErr='';render();break;
   case 'demoFill':$('#lg_code').value='fac_A';$('#lg_id').value='venue-a';$('#lg_pw').value='DcCreate-a-2026';break;
   case 'accNew':S.issued=null;S.accErr='';S.accEdit={_new:true,code:'fac_A',id:'',name:'',role:'V',fac:['A']};render();break;
   case 'accEdit':{S.issued=null;S.accErr='';const a=ACCOUNTS[+v];S.accEdit={_i:+v,code:a.code,id:a.id,name:a.name,role:a.role,fac:[...a.fac]};render();break}
   case 'accCancel':S.accEdit=null;S.accErr='';render();break;
   case 'accFac':{if($('#ac_name'))S.accEdit.name=$('#ac_name').value;if($('#ac_id'))S.accEdit.id=$('#ac_id').value;const f=S.accEdit.fac;const i=f.indexOf(v);i<0?f.push(v):f.splice(i,1);render();break}
   case 'accReset':resetPw(+v);break;
   case 'accUnlock':{const a=ACCOUNTS[+v];a.locked=false;a.fails=0;logEvt(a.code,a.id,true,'ロック解除');render();toast('ロックを解除しました');break}
   case 'accToggle':{const a=ACCOUNTS[+v];a.active=!a.active;logEvt(a.code,a.id,true,a.active?'再開':'停止');render();break}
   case 'copyIssued':navigator.clipboard?.writeText(S.issued.pw).then(()=>toast('コピーしました')).catch(()=>toast('選択してコピーしてください'));break;
   case 'improveImg':{S.view='creative';S.crTab='studio';const st=studio();const a=d.assets.find(x=>x.id===v);if(a&&usable(a))st.asset=v;render();window.scrollTo(0,0);toast('クリエイティブ作成を開きました。差し替える画像とキャッチを選んでください');break}
   case 'dayMedia':S.dayMedia=v;render();break;
   case 'gotoCr':{const cr=d.creatives.find(c=>c.id===v);S.view='creative';S.crTab={'Google検索':'google','Instagram':'instagram','YouTube':'youtube'}[cr.media];S.crSel=v;render();window.scrollTo(0,0);break}
   case 'exportXlsx':exportXlsx();break;
   case 'notesReset':{S.notes=S.notes||{};delete S.notes[S.fac+'|'+S.p];render();toast('数値から下書きし直しました');break}
   case 'exportAds':exportAds();break;
   case 'copyPrompt':{const t=PROMPTS[v];navigator.clipboard?.writeText(t).then(()=>toast(`${v} をコピーしました`)).catch(()=>{const r=document.createRange();r.selectNodeContents($('#pr_'+v));getSelection().removeAllRanges();getSelection().addRange(r);toast('選択しました。コピーしてください')});break}
   case 'copyModal':{const t=$('#modalText');navigator.clipboard?.writeText(t.value).then(()=>toast('コピーしました')).catch(()=>{t.select();toast('選択しました。コピーしてください')});break}
  }
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind==='st'){studio()[el.dataset.k]=el.value;clearTimeout(drawStudio.t);drawStudio.t=setTimeout(drawStudio,120)}});
document.addEventListener('change',e=>{
  const el=e.target,b=el.dataset.bind;if(!b)return;
  if(b==='fac'){S.fac=el.value;S.draft=null;S.imp=null;S.crSel=null;render()}
  else if(b==='p'){S.p=+el.value;render()}
  else if(b==='acc'){const e=S.accEdit;const k=el.dataset.k;e[k]=el.value;if(k==='code'||k==='role'){if(k==='code'){e.fac=e.code==='HQ'?['A','B']:[...FAC_CODES[e.code].fac];if(e.code!=='HQ')e.role='V'}e.name=$('#ac_name')?$('#ac_name').value:e.name;e.id=$('#ac_id')?$('#ac_id').value:e.id;render()}}
  else if(b==='crSort'){S.crSort=el.value;render()}
  else if(b==='feeOn'){S.fee=S.fee||{rate:.2};S.fee.on=el.checked;render()}
  else if(b==='feeRate'){S.fee=S.fee||{on:false};S.fee.rate=Math.max(0,Math.min(100,+el.value||0))/100;render()}
  else if(b==='note'){S.notes[S.fac+'|'+S.p][el.dataset.k]=el.value}
  else if(b==='noteNext'){S.notes[S.fac+'|'+S.p].next[el.dataset.k]=el.value}
  else if(b==='st'){render()}
  else if(b==='role'){S.role=el.value;S.draft=null;render();toast(`${ROLES[S.role].label} として表示しています`)}
  else if(b==='src'){S.src=el.value;render()}
  else if(b==='media'){S.media=el.value;render()}
  else if(b==='minN'){S.minN=Math.max(3,+el.value||10);render()}
  else if(b==='cap'){F().cap=Math.max(0,+el.value||0);audit(`月間広告費上限を ${yenT(F().cap)}円 に変更`,'設定');render()}
  else if(b==='map'){S.imp.map[el.dataset.k]=+el.value;render()}
  else if(b==='csv'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadCsv(String(r.result),f.name);r.readAsText(f)}
  else if(b==='img'){if(el.files.length)addDolImages(el.files)}
  else if(b==='dolcsv'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadDolMeta(String(r.result));r.readAsText(f)}
  else if(b==='draft'){const k=el.dataset.k;const D=S.draft;if(k==='imgLabel')D[k]=el.checked;else if(k==='budget')D[k]=+el.value||0;else if(k==='headlines'||k==='descs')D[k]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);else if(k==='hashtags')D[k]=el.value.split(/\s+/).filter(Boolean);else if(k==='scenes')D[k]=el.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const x=l.split('|');return {t:x[0]||'',visual:x[1]||'',telop:x[2]||'',audio:x[3]||'',a:(x[4]||'').trim()}});else D[k]=el.value;render()}
});
render();
</script>
